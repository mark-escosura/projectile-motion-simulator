<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A physics-based projectile motion simulator">
    <title>Projectile Motion Simulator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="container">
        <header>
            <h1>Projectile Motion Simulator</h1>
        </header>

        <section class="simulation-controls">
            <form id="simulationForm" class="controls">
                <fieldset>
                    <legend>Simulation Parameters</legend>
                    <div class="input-group">
                        <label for="velocity">Initial Velocity (m/s):</label>
                        <input type="number" id="velocity" name="velocity" value="10" min="0" step="1" required>
                    </div>
                    <div class="input-group">
                        <label for="angle">Launch Angle (degrees):</label>
                        <input type="number" id="angle" name="angle" value="45" min="0" max="90" step="1" required>
                    </div>
                    <div class="input-group">
                        <label for="height">Initial Height (m):</label>
                        <input type="number" id="height" name="height" value="0" min="0" step="0.1" required>
                    </div>
                    <button type="button" id="startButton">Start Simulation</button>
                </fieldset>
            </form>
        </section>

        <section class="simulation-display" aria-label="Simulation Canvas">
            <canvas id="simulationCanvas" width="800" height="450" role="img"
                aria-label="Projectile motion visualization"></canvas>
        </section>

        <div class="stats-box">
            <h2>Flight Statistics</h2>
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-label">Maximum Height</span>
                    <span class="stat-value" id="maxHeight">0.00 m</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Flight Time</span>
                    <span class="stat-value" id="flightTime">0.00 s</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Distance Traveled</span>
                    <span class="stat-value" id="distance">0.00 m</span>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>Projectile Motion Simulator - Physics Education Tool</p>
    </footer>

    <script src="simulator.js"></script>
</body>

</html>
